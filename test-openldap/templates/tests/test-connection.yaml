apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "test-openldap.fullname" . }}-test-connection"
  labels:
    {{- include "test-openldap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: ldapsearch
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      command: ["sh", "-c"]
      args:
        - >
          ldapsearch
          -H 'ldap://{{ include "test-openldap.fullname" . }}:{{ .Values.service.ldapPort }}'
          -x -LL
          -b 'ou=people,dc=planetexpress,dc=com'
          -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone
          'uid=zoidberg' |
          grep 'mail: zoidberg@planetexpress.com'
  restartPolicy: Never
